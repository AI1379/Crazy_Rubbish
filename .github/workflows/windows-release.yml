name: Windows release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Optional package version, e.g. 0.2.0-rc.1; empty creates a CI snapshot
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: windows-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      build_version: ${{ steps.metadata.outputs.build_version }}
      unity_version: ${{ steps.metadata.outputs.unity_version }}
      artifact: ${{ steps.metadata.outputs.artifact }}
      zip: ${{ steps.metadata.outputs.zip }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check packaging scripts
        shell: pwsh
        run: ./Tools/CI/TestPipeline.ps1
      - name: Resolve release metadata
        id: metadata
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          ./Tools/CI/GetBuildMetadata.ps1 -ReleaseTag $env:RELEASE_TAG -ManualVersion $env:MANUAL_VERSION -RunNumber ([int]$env:GITHUB_RUN_NUMBER)

  unity-tests:
    needs: metadata
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          lfs: true
          persist-credentials: false
      - name: Check Personal license secrets
        shell: pwsh
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          foreach ($name in @('UNITY_LICENSE', 'UNITY_EMAIL', 'UNITY_PASSWORD')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Missing Actions secret: $name. See Docs/Development/05_CI与发布.md." }
          }
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: Library
          key: Library-Linux-EditMode-${{ needs.metadata.outputs.unity_version }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Linux-EditMode-${{ needs.metadata.outputs.unity_version }}-
      - name: Run EditMode rules
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          cliVersion: v0.1.72
          testMode: EditMode
          coverageEnabled: false
          artifactsPath: TestResults/ci-editmode
          githubToken: ''
      - name: Preserve Unity test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unity-test-results
          path: TestResults/ci-editmode
          if-no-files-found: ignore
          retention-days: 14

  build:
    needs: [metadata, unity-tests]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          lfs: true
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: Library
          key: Library-Linux-WindowsMono-${{ needs.metadata.outputs.unity_version }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Linux-WindowsMono-${{ needs.metadata.outputs.unity_version }}-
      - name: Build Windows x64 Mono player
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ needs.metadata.outputs.unity_version }}
          targetPlatform: StandaloneWindows64
          buildMethod: CrazyRubbish.Editor.PrototypeProjectSetup.BuildWindowsRelease
          buildName: CrazyRubbish
          buildsPath: Builds
          versioning: None
          customParameters: -releaseVersion ${{ needs.metadata.outputs.build_version }}
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unity-build-logs
          path: |
            Logs
            build.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Transfer Windows player
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-player
          path: Builds/WindowsRelease
          if-no-files-found: error
          retention-days: 7

  verify-and-package:
    needs: [metadata, build]
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-player
          path: Builds/WindowsRelease
      - name: Run the Windows player without graphics
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ needs.metadata.outputs.build_version }}
        run: ./Tools/CI/SmokeWindows.ps1 -ExpectedVersion $env:EXPECTED_VERSION -Automation -TimeoutSeconds 240
      - name: Package complete player and checksum
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          UNITY_VERSION: ${{ needs.metadata.outputs.unity_version }}
        run: |
          ./Tools/CI/PackageWindows.ps1 -Version $env:PACKAGE_VERSION -Commit $env:GITHUB_SHA -Repository $env:GITHUB_REPOSITORY -ReleaseTag $env:RELEASE_TAG -UnityVersion $env:UNITY_VERSION
      - name: Upload distributable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ needs.metadata.outputs.artifact }}
          path: |
            Artifacts/Release/*.zip
            Artifacts/Release/*.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Preserve player acceptance reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-smoke-results
          path: TestResults/ci-smoke
          if-no-files-found: ignore
          retention-days: 14

  publish:
    if: github.event_name == 'release'
    needs: [metadata, verify-and-package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.metadata.outputs.artifact }}
          path: release-assets
      - name: Attach package to the triggering release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ZIP_NAME: ${{ needs.metadata.outputs.zip }}
        run: |
          gh release upload "$RELEASE_TAG" "release-assets/$ZIP_NAME" "release-assets/$ZIP_NAME.sha256" --repo "$GITHUB_REPOSITORY" --clobber
